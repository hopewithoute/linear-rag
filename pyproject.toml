[project]
name = "linear-rag"
version = "0.1.0"
description = "LinearRag-RAG Engine - Multi-hop context retrieval via sparse graph walking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "scipy>=1.14.0",
    "numpy>=2.1.0",
    "gliner>=0.2.26",
    "spacy>=3.8.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "datasets>=5.0.0",
    "ragas==0.4.3",
    "langchain-openai==1.3.2",
    "langchain-community==0.3.31",
    "langchain==1.3.9",
    "langchain-google-vertexai==3.2.4",
    "igraph>=1.0.0",
    "sentence-transformers>=5.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
